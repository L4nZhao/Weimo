<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/project-report-assistant-icon.svg" />
    <title>管理员登录</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f9f9f9;
        --panel: #ffffff;
        --line: #e6e6e6;
        --text: #0d0d0d;
        --muted: #8f8f8f;
        --soft: #f2f2f2;
        --hover: #ececec;
        --input-bg: #ffffff;
        --table-head: transparent;
        --brand: #0d0d0d;
        --brand-dark: #2d2d2d;
        --danger: #d92d20;
        --focus: rgba(13, 13, 13, 0.35);
        --focus-ring: rgba(13, 13, 13, 0.35);
        --on-brand: #ffffff;
        --radius-s: 12px;
        --radius-m: 12px;
        --radius-l: 16px;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04);
        --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #212121;
        --panel: #2b2b2b;
        --line: #3f3f3f;
        --text: #ececec;
        --muted: #b4b4b4;
        --soft: #2f2f2f;
        --hover: #383838;
        --input-bg: #2f2f2f;
        --table-head: transparent;
        --brand: #ececec;
        --brand-dark: #ffffff;
        --danger: #f97066;
        --focus: rgba(236, 236, 236, 0.35);
        --focus-ring: rgba(236, 236, 236, 0.35);
        --on-brand: #0d0d0d;
        --radius-s: 12px;
        --radius-m: 12px;
        --radius-l: 16px;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.04);
        --font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-family);
        font-size: 14px;
        line-height: 1.65;
        overflow-x: hidden;
        padding: 24px;
      }

      main {
        width: min(400px, calc(100vw - 32px));
        border: 1px solid var(--line);
        border-radius: var(--radius-l);
        background: var(--panel);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }

      header {
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 24px 24px 16px;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: var(--radius-s);
        object-fit: cover;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1.3;
      }

      p { margin: 0; color: var(--muted); font-size: 14px; }
      form { display: grid; gap: 12px; padding: 20px 24px 24px; }
      label { display: grid; gap: 6px; font-weight: 600; font-size: 13px; }

      input {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: var(--radius-m);
        background: var(--input-bg);
        color: var(--text);
        padding: 10px 11px;
        font: inherit;
        outline: none;
        transition:
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      input::placeholder { color: var(--muted); }
      input:focus { border-color: var(--focus); box-shadow: 0 0 0 2px var(--focus-ring); }

      button {
        min-height: 44px;
        border: 1px solid var(--brand);
        border-radius: 999px;
        background: var(--brand);
        color: var(--on-brand);
        cursor: pointer;
        font: inherit;
        font-weight: 650;
        padding: 10px 12px;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          box-shadow 120ms ease;
      }

      button:hover { border-color: var(--brand-dark); background: var(--brand-dark); }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 2px;
      }

      .error { min-height: 20px; color: var(--danger); font-size: 13px; }

      @media (max-width: 480px) {
        body {
          align-items: stretch;
          padding: 16px;
        }

        main {
          align-self: center;
          width: 100%;
        }

        header {
          padding: 22px 18px 14px;
        }

        form {
          padding: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="login-logo" src="/project-report-assistant-icon.svg" alt="" aria-hidden="true" />
        <h1>管理员登录</h1>
        <p>仅 admin 可进入报告后台</p>
      </header>
      <form id="login-form">
        <label>用户名<input id="username" autocomplete="username" value="admin" required /></label>
        <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required /></label>
        <div id="error" class="error"></div>
        <button type="submit">登录</button>
      </form>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        error.textContent = "";
        const response = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        if (!response.ok) {
          const data = await response.json().catch(() => ({ error: "登录失败" }));
          error.textContent = data.error || "登录失败";
          return;
        }
        window.location.href = "/";
      });
    </script>
  </body>
</html>
